<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PilotSense</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Inter, Arial, sans-serif;
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .card {
        background: white;
        padding: 36px 34px;
        border-radius: 14px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        width: 460px;
        max-width: calc(100vw - 32px);
        text-align: center;
      }

      .logo {
        height: 62px;
        margin-bottom: 16px;
        object-fit: contain;
      }

      h1 {
        font-size: 26px;
        margin: 0 0 8px;
        color: #1d3557;
      }

      .subtitle {
        font-size: 14px;
        color: #6c757d;
        margin-bottom: 22px;
      }

      .flight-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: left;
      }

      .flight-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border: 1px solid #eef1f5;
        border-radius: 10px;
        transition: border-color 0.12s, background 0.12s;
      }
      .flight-row:hover { border-color: #d1d9e6; background: #fafbfd; }

      .flight-main { flex: 1; min-width: 0; }

      .flight-name {
        font-size: 14px;
        font-weight: 600;
        color: #1d3557;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .badge {
        display: inline-block;
        margin-top: 3px;
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .badge.ok    { color: #1a8a3c; background: rgba(26, 138, 60, 0.12); }
      .badge.stale { color: #b06a00; background: rgba(244, 180, 0, 0.16); }
      .badge.none  { color: #6b7785; background: #eef1f5; }

      .flight-actions { display: flex; gap: 7px; flex: none; }

      .btn {
        padding: 7px 12px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: 0.15s;
      }
      .btn-proc { background: #e9ecef; color: #495057; }
      .btn-proc:hover { background: #dfe3e7; }
      .btn-proc:disabled { opacity: 0.6; cursor: progress; }
      .btn-view { background: #457b9d; color: white; }
      .btn-view:hover { background: #3a6b8a; }

      .empty {
        color: #9aa1ab;
        font-size: 14px;
        padding: 24px 0;
      }

      footer {
        margin-top: 22px;
        font-size: 12px;
        color: #9aa1ab;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <img src="/static/logo_color.png" class="logo" alt="PilotSense Logo" />

      <h1>PilotSense</h1>
      <div class="subtitle">Select a flight to visualize</div>

      <div class="flight-list">
        {% for f in flights %}
        <div class="flight-row" data-id="{{f.id}}">
          <div class="flight-main">
            <div class="flight-name">{{f.id}}</div>
            {% if not f.processed %}
              <span class="badge none">Not processed</span>
            {% elif f.stale %}
              <span class="badge stale">Data changed</span>
            {% else %}
              <span class="badge ok">Processed</span>
            {% endif %}
          </div>
          <div class="flight-actions">
            {% if not f.processed %}
            <button class="btn btn-proc" onclick="processFlight('{{f.id}}', this)">Process</button>
            {% endif %}
            <button class="btn btn-view" onclick="window.location='/flight/{{f.id}}'">Visualize</button>
          </div>
        </div>
        {% else %}
        <div class="empty">No flights found in data/parsed/.</div>
        {% endfor %}
      </div>

      <footer>ADS-B Flight Analysis</footer>
    </div>

    <script>
      // Manual trigger: (re)build the flight's cached trajectory + safety
      // events on the server, then update the row's badge in place.
      async function processFlight(id, btn) {
        const row = btn.closest(".flight-row");
        const badge = row.querySelector(".badge");
        const original = btn.textContent.trim();
        btn.disabled = true;
        btn.textContent = "Processing…";
        try {
          const res = await fetch(`/api/flights/${encodeURIComponent(id)}/process`, {
            method: "POST",
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.detail || `Failed (${res.status})`);
          badge.className = "badge ok";
          badge.textContent = "Processed";
          btn.remove();  // index only offers first-time processing; reprocess lives on the flight pages
        } catch (err) {
          badge.className = "badge none";
          badge.textContent = "Failed";
          btn.textContent = original;
          console.error(err);
        } finally {
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
